name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard-and-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci --prefix cloudflare
      - run: npm test --prefix cloudflare
      - name: Interrupt classifier regression
        run: |
          g++ -std=c++11 -Ifirmware/include firmware/test/interrupt_reason.cpp -o /tmp/interrupt-reason-test
          /tmp/interrupt-reason-test
      - run: python tools/check_links.py
      - run: python tools/check_fit.py
      - run: python tools/check_board_fasteners.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: python -m platformio run -d firmware -e feather -e bench -e tune -e boardcheck -e sensorcheck
