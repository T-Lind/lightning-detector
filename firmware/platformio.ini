[env:feather]
platform = espressif32@6.10.0
board = adafruit_feather_esp32_v2
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library@1.4.9
  bblanchon/ArduinoJson@6.21.5
build_flags = -D CORE_DEBUG_LEVEL=0

[env:bench]
extends = env:feather
build_flags = ${env:feather.build_flags} -D BENCH_MODE=1

[env:tune]
extends = env:feather
build_flags = ${env:feather.build_flags} -D TUNE_MODE=1

[env:boardcheck]
extends = env:feather
build_src_filter = -<*> +<boardcheck.cpp>

[env:sensorcheck]
extends = env:feather
build_src_filter = -<*> +<sensorcheck.cpp>
