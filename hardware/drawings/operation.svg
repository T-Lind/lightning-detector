<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530"><style>text{font-family:Arial,sans-serif;fill:#183236}.small{font-size:13px}.muted{fill:#5d7275}.title{font-size:25px;font-weight:bold}</style><rect width="100%" height="100%" fill="#f7faf8"/><text x="40" y="45" font-size="16" class="title">V1 / Wake, capture, upload, sleep</text><rect x="40" y="110" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="56" y="145" font-size="19" class="">1. AS3935 listening</text><text x="56" y="177" font-size="14" class="muted">ESP32 deep asleep</text><rect x="360" y="110" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="376" y="145" font-size="19" class="">2. INT high</text><text x="376" y="177" font-size="14" class="muted">ESP32 wakes</text><rect x="680" y="110" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="696" y="145" font-size="19" class="">3. Read result first</text><text x="696" y="177" font-size="14" class="muted">SPI + ≥2 ms delay</text><rect x="40" y="260" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="56" y="295" font-size="19" class="">4. Save queue</text><text x="56" y="327" font-size="14" class="muted">Durable flash slots</text><rect x="360" y="260" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="376" y="295" font-size="19" class="">5. Wi-Fi / HTTPS</text><text x="376" y="327" font-size="14" class="muted">Signed batch + ACK</text><rect x="680" y="260" width="285" height="100" rx="8" fill="#e2eee9" stroke="#335955"/><text x="696" y="295" font-size="19" class="">6. Return to sleep</text><text x="696" y="327" font-size="14" class="muted">Timer + GPIO33</text><text x="40" y="444" font-size="15" class="">Sensor remains powered at all times. ESP32 only wakes for events, queued retries, or health reports.</text><text x="40" y="475" font-size="15" class="">Cloud keeps the activity window. Overdue/faulty sensor → UNKNOWN. No bearing is measured.</text><text x="40" y="504" font-size="14" class="muted">A sensor result can be overwritten by later events; burst completeness is not guaranteed.</text></svg>