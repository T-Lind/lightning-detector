<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><style>text{font-family:Arial,sans-serif;fill:#183236}.small{font-size:13px}.muted{fill:#5d7275}.title{font-size:25px;font-weight:bold}</style><rect width="100%" height="100%" fill="#f7faf8"/><text x="40" y="48" font-size="16" class="title">V1 / Electrical wiring</text><text x="40" y="74" font-size="14" class="muted">Logical connections. Match pad LABELS on each board; positions below are not a physical pinout.</text><rect x="50" y="140" width="255" height="370" rx="8" fill="#e2eee9" stroke="#335955"/><text x="74" y="174" font-size="20" class="">Adafruit Feather V2</text><rect x="720" y="140" width="230" height="370" rx="8" fill="#e2eee9" stroke="#335955"/><text x="743" y="174" font-size="19" class="">SparkFun SEN-15441</text><text x="75" y="216" font-size="15" class="">3V (always on)</text><text x="739" y="216" font-size="15" class="">3V3</text><path d="M306 211 L719 211" fill="none" stroke="#c8514c" stroke-width="2" stroke-dasharray=""/><text x="470" y="205" font-size="12" class=""></text><text x="75" y="256" font-size="15" class="">GND</text><text x="739" y="256" font-size="15" class="">GND</text><path d="M306 251 L719 251" fill="none" stroke="#273f48" stroke-width="2" stroke-dasharray=""/><text x="470" y="245" font-size="12" class=""></text><text x="75" y="296" font-size="15" class="">D33 / GPIO33</text><text x="739" y="296" font-size="15" class="">INT (active HIGH)</text><path d="M306 291 L719 291" fill="none" stroke="#a06617" stroke-width="2" stroke-dasharray=""/><text x="470" y="285" font-size="12" class=""></text><text x="75" y="336" font-size="15" class="">D27 / GPIO27</text><text x="739" y="336" font-size="15" class="">CS</text><path d="M306 331 L719 331" fill="none" stroke="#855bac" stroke-width="2" stroke-dasharray=""/><text x="470" y="325" font-size="12" class=""></text><text x="75" y="376" font-size="15" class="">SCK / GPIO5</text><text x="739" y="376" font-size="15" class="">SCK</text><path d="M306 371 L719 371" fill="none" stroke="#527bb6" stroke-width="2" stroke-dasharray=""/><text x="470" y="365" font-size="12" class="">1 MHz SPI mode 1</text><text x="75" y="416" font-size="15" class="">MI / GPIO21</text><text x="739" y="416" font-size="15" class="">MISO</text><path d="M306 411 L719 411" fill="none" stroke="#397765" stroke-width="2" stroke-dasharray=""/><text x="470" y="405" font-size="12" class=""></text><text x="75" y="456" font-size="15" class="">MO / GPIO19</text><text x="739" y="456" font-size="15" class="">MOSI</text><path d="M306 451 L719 451" fill="none" stroke="#9b597b" stroke-width="2" stroke-dasharray=""/><text x="470" y="445" font-size="12" class=""></text><text x="50" y="540" font-size="16" class="">Battery: Adafruit 328, protected 1S 3.7V LiPo → Feather JST-PH socket</text><text x="50" y="568" font-size="15" class="">At SENSOR end: R1 100kΩ SCK → GND; R2 100kΩ MOSI → GND. Onboard R8 holds CS high.</text><text x="50" y="595" font-size="15" class="">8-wire harness: GND, 3V3, INT, GND, CS, SCK, MISO, MOSI. Connect both grounds.</text><text x="50" y="623" font-size="15" class="">Cut sensor LED jumper after bench test. Preserve the factory SPI interface jumper.</text><text x="50" y="650" font-size="15" class="">Power the sensor from main 3V. GPIO35 battery divider is already on the Feather.</text><text x="50" y="679" font-size="14" class="muted">USB-C is used indoors for programming / charging; there is no USB hole in the enclosure.</text></svg>